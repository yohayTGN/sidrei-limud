name = "sidrei-limud-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# ----------------------------------------------------------------------------
# Secrets — SCRIPT_URL and API_TOKEN. Declared here only as names, in this
# comment. Never write their values in this file, in any other committed
# file, or in [vars] below. Set them with:
#
#   wrangler secret put SCRIPT_URL
#   wrangler secret put API_TOKEN
#
# SCRIPT_URL is the Apps Script web app's /exec URL.
# API_TOKEN must match whatever setApiToken(token) was run with in the
# Apps Script editor (apps-script/Api.gs).
#
# `wrangler secret put` stores the value in Cloudflare, encrypted, and makes
# it available as env.SCRIPT_URL / env.API_TOKEN at runtime — it is never
# visible in this repo, in `wrangler.toml`, or in the dashboard after it's
# set. See worker/README.md for the full walkthrough.
# ----------------------------------------------------------------------------
